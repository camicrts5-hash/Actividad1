<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 - Conversor(km-millas)</title>
    <link rel="stylesheet" href="css/ejercicio11.css">
    <script src="js/ejercicio11.js"></script>
</head>

<body>
    <div class="contenedor-formulario">
        <h1>Calculadora de Distancia</h1>
        <p class="subtitulo">Kilómetros a Millas</p>

        <!--Grupo Kilometros-->
        <div class="grupo-formulario">
            <label for="kilometros">Kilómetros</label>
            <input type="number" id="kilometros" placeholder="Ej. 28">
        </div>

        <!--Botón-->
        <button onclick="convertir()" class="boton-enviar">Convertir</button>

        <!--Grupo Resultado-->
        <div class="grupo-formulario" style="margin-top: 20px;">
            <label for="resultado">Millas</label>
            <input type="text" id="resultado" readonly>
        </div>

    </div>
</body>
