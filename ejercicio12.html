<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 12 - Conversor(MX-USD)</title>
    <link rel="stylesheet" href="css/ejercicio12.css">
    <script src="js/ejercicio12.js"></script>
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Calculadora de Dinero</h1>
        <p class="subtitulo">Pesos MX a Dolares USD</p>

        <!-- Grupo Pesos -->
        <div class="grupo-formulario">
            <label for="pesos">Pesos MX</label>
            <input type="number" id="pesos" placeholder="Ej. 100">
        </div>

        <!-- Botón -->
        <button onclick="convertir()" class="boton-enviar">Convertir</button>

        <!-- Grupo Resultado -->
        <div class="grupo-formulario" style="margin-top: 20px;">
            <label for="resultado">Dolares USD</label>
            <input type="text" id="resultado" readonly>
        </div>
    </div>

</body>
</html>
