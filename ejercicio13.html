<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 - Verificador</title>
    <link rel="stylesheet" href="css/ejercicio13.css">
    <script src="js/ejercicio13.js"></script>
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Verificador de edad</h1>
        <p class="subtitulo">Ingrese su edad en el siguiente campo para verificar si es mayor de edad.</p>

        <!-- Grupo Edad -->
        <div class="grupo-formulario">
            <label for="edad">Edad</label>
            <input type="number" id="edad" placeholder="Ej. 20">
        </div>

        <!-- Botón -->
        <button onclick="convertir()" class="boton-enviar">Verificar</button>

        <!-- Grupo Resultado -->
        <div class="grupo-formulario" style="margin-top: 20px;">
            <label for="resultado">Resultado</label>
            <input type="text" id="resultado" readonly>
        </div>
    </div>
</body>
</html>
