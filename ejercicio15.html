<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15 - Registro de Estudiantes con Objetos</title>
    <link rel="stylesheet" href="css/ejercicio15.css">
    <script src="js/ejercicio15.js"></script>
</head>

<body>
    <div class="contenedor-formulario">
        <h1>Registro de Estudiantes</h1>
        <p class="subtitulo">Agrega alumnos y calcula promedios y extremos</p>

        <!-- Campo Nombre -->
        <div class="grupo-formulario">
            <label for="nombre">Nombre del Estudiante</label>
            <input type="text" id="nombre" placeholder="Ej. Ana">
        </div>

        <!-- Campo Calificación -->
        <div class="grupo-formulario">
            <label for="calificacion">Calificación</label>
            <input type="number" id="calificacion" placeholder="Ej. 92">
        </div>

        <!-- Botón Agregar Estudiante -->
        <button onclick="agregarEstudiante()" class="boton-enviar">Agregar Estudiante</button>

        <!-- Botón Calcular -->
        <button onclick="calcularResultados()" class="boton-enviar">Calcular</button>

        <!-- Resultados (Readonly) -->
        <div class="grupo-formulario">
            <label for="promedio">Calificación Promedio</label>
            <input type="text" id="promedio" readonly>
        </div>

        <div class="grupo-formulario">
            <label for="mejorEstudiante">Estudiante con Calificación más Alta</label>
            <input type="text" id="maxima" readonly>
        </div>

        <div class="grupo-formulario">
            <label for="peorEstudiante">Estudiante con Calificación más Baja</label>
            <input type="text" id="minima" readonly>
        </div>
    </div>
</body>
</html>
